aid: mihup
name: Mihup
description: 'Mihup is an enterprise Voice AI and speech analytics platform founded in
  2016 and headquartered in Kolkata, India. Its full-stack voice AI (ASR, NLU, TTS,
  analytics) powers four products: Interaction Analytics (MIA) for 100% call auditing,
  Voice Agent (MVA) for inbound/outbound call automation, Agent Assist (MAA) for real-time
  live-agent guidance, and Automotive Voice Agent (AVA) for in-car assistants in software-defined
  vehicles. Proprietary phoneme-based (G2P) recognition supports 120+ languages, accents
  and dialects including 20+ Indian languages and code-mixed Hinglish. Mihup runs in
  1.5M+ cars, processes 5M+ interactions daily, and is trusted by 500+ businesses
  including Tata Motors, SBI Life and IDFC FIRST Bank. ISO 27001 certified, DPDP Act
  2023 and RBI data-localization compliant, hosted in AWS Mumbai. Mihup exposes APIs
  and SDKs for IVI systems, chipsets, telecom stacks and CRMs, but publishes no public
  developer portal — access is enterprise/demo-gated.'
